schema_version: "1.0"

extension:
  id: xref
  name: "Spec X-Ref"
  version: "0.1.3"
  description: "Requirement-to-task-to-code traceability and drift checks: unplanned changes, @spec anchors, coverage, intent"
  author: moinsen-dev
  repository: https://github.com/moinsen-dev/speckit-xref
  license: MIT
  homepage: https://github.com/moinsen-dev/speckit-xref/tree/main/extension
  category: code
  effect: read-write

requires:
  # __SPECKIT_COMMAND_*__ tokens resolve in every registerable layout from 0.12.17 on.
  speckit_version: ">=0.12.17,<2.0.0"
  tools:
    - name: python3
      required: true
      description: "Runs scripts/python/xref.py (standard library only)"
    - name: git
      required: false
      description: "Finds the changed files for a drift check"
    - name: rg
      required: false
      description: "Finds @spec anchors faster (git grep or a walk otherwise)"

provides:
  commands:
    - name: speckit.xref.map
      file: commands/speckit.xref.map.md
      description: "Map each functional requirement to the tasks that implement it and record the map in xref.json"
    - name: speckit.xref.check
      file: commands/speckit.xref.check.md
      description: "Check the code against the active spec: unplanned changes, anchors, coverage, and the user's intent"
    - name: speckit.xref.report
      file: commands/speckit.xref.report.md
      description: "Write a traceability report: requirement to tasks to files and @spec anchors, plus drift"

hooks:
  after_tasks:
    command: speckit.xref.map
    optional: true
    prompt: "Map requirements to tasks for traceability and drift tracking?"
    description: "Record which tasks implement which requirement"
  after_implement:
    command: speckit.xref.check
    optional: true
    prompt: "Check the implementation for drift from the spec?"
    description: "Unplanned changes, dangling anchors, coverage and an intent check"

tags:
  - "traceability"
  - "drift"
  - "requirements"
  - "quality"

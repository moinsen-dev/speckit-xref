schema_version: "1.0"

extension:
  id: xref
  name: "Spec X-Ref"
  version: "0.7.1"
  description: "Requirement-to-task-to-code traceability and drift checks: unplanned changes, @spec anchors, a coverage ladder proven by tests, intent"
  author: moinsen-dev
  repository: https://github.com/moinsen-dev/speckit-xref
  license: MIT
  homepage: https://github.com/moinsen-dev/speckit-xref/tree/main/extension
  category: code
  effect: read-write

requires:
  # __SPECKIT_COMMAND_*__ tokens resolve in every registerable layout from 0.12.17 on.
  speckit_version: ">=0.12.17,<2.0.0"
  tools:
    - name: python3
      required: true
      description: "Runs scripts/python/xref.py (standard library only)"
    - name: git
      required: false
      description: "Finds the changed files for a drift check"
    - name: rg
      required: false
      description: "Finds @spec anchors faster (git grep or a walk otherwise)"

provides:
  commands:
    - name: speckit.xref.map
      file: commands/speckit.xref.map.md
      description: "Map each functional requirement to the tasks that implement it and record the map in xref.json"
    - name: speckit.xref.check
      file: commands/speckit.xref.check.md
      description: "Check the code against the active spec: unplanned changes, anchors, coverage, and the user's intent"
    - name: speckit.xref.report
      file: commands/speckit.xref.report.md
      description: "Write a traceability report: requirement to tasks to files and @spec anchors, plus drift"
    - name: speckit.xref.verify
      file: commands/speckit.xref.verify.md
      description: "Run the tests and record which requirements they prove: passing or failing, per requirement"
    - name: speckit.xref.validate
      file: commands/speckit.xref.validate.md
      description: "Research a new idea before it becomes a spec: who has the problem, what exists, what differs, the riskiest assumption, kill criteria, a score"
    - name: speckit.xref.shape
      file: commands/speckit.xref.shape.md
      description: "Settle the first version with the person (scope, platforms, language, design, data) before the spec"
    - name: speckit.xref.accept
      file: commands/speckit.xref.accept.md
      description: "Play a finished feature through scenario by scenario with Playwright or Maestro, keep the tests, list what only a person can check"
    - name: speckit.xref.prd
      file: commands/speckit.xref.prd.md
      description: "Review a PRD and cut it into features: blocking decisions, a roadmap in build order with the PRD's ids, sections and gates"
    - name: speckit.xref.design
      file: commands/speckit.xref.design.md
      description: "Settle a feature's look after the plan: DESIGN.md (Google Stitch's format) and one HTML mock per screen, traced to its user stories"
    - name: speckit.xref.ship
      file: commands/speckit.xref.ship.md
      description: "Check that a finished app is ready to release and plan it: release.md with the checks, the release commands per platform and the person's part; nothing goes out without their yes"
    - name: speckit.xref.revise
      file: commands/speckit.xref.revise.md
      description: "Fold a change request into the spec: new requirement ids, SUPERSEDED and RETIRED markers, appended tasks, revisions.md"

hooks:
  after_plan:
    command: speckit.xref.design
    optional: true
    prompt: "Draw the look (DESIGN.md and a mock per screen) before the tasks?"
    description: "A feature with a user interface gets its design system and screen mocks"
  after_tasks:
    command: speckit.xref.map
    optional: true
    prompt: "Map requirements to tasks for traceability and drift tracking?"
    description: "Record which tasks implement which requirement"
  after_implement:
    command: speckit.xref.check
    optional: true
    prompt: "Check the implementation for drift from the spec?"
    description: "Unplanned changes, dangling anchors, coverage and an intent check"

tags:
  - "traceability"
  - "drift"
  - "requirements"
  - "quality"
